<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: #f5f7fa; color: #1a1a2e; font-family: 'Noto Sans KR', sans-serif; }

/* 타임라인 컨테이너 */
.timeline-wrap { max-width: 900px; margin: 0 auto; padding: 3rem 2rem 5rem; }

/* 연도 그룹 */
.year-group { display: flex; gap: 0; margin-bottom: 0; position: relative; }
.year-group:last-child .events-col::after { display: none; }

/* 연도 컬럼 */
.year-col {
  width: 110px;
  flex-shrink: 0;
  padding-top: 1.6rem;
  position: relative;
}
.year-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 88px;
  height: 36px;
  background: #003087;
  color: white;
  font-size: 0.9rem;
  font-weight: 700;
  border-radius: 8px;
  letter-spacing: 0.05em;
  position: relative;
  z-index: 2;
  transition: background 0.2s, transform 0.2s;
}
.year-group:hover .year-badge {
  background: #FF6600;
  transform: scale(1.05);
}

/* 세로선 */
.line-col {
  width: 32px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 1.6rem;
}
.line-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: white;
  border: 3px solid #003087;
  flex-shrink: 0;
  margin-top: 11px;
  z-index: 2;
  transition: background 0.2s, border-color 0.2s, transform 0.2s;
}
.year-group:hover .line-dot {
  background: #FF6600;
  border-color: #FF6600;
  transform: scale(1.3);
}
.line-bar {
  width: 2px;
  flex: 1;
  background: #d1dae8;
  margin-top: 4px;
  min-height: 20px;
}

/* 이벤트 컬럼 */
.events-col {
  flex: 1;
  padding: 1.4rem 0 0.5rem 1.2rem;
}

/* 이벤트 아이템 */
.event-item {
  display: flex;
  align-items: flex-start;
  gap: 0.8rem;
  padding: 0.55rem 1rem;
  border-radius: 8px;
  margin-bottom: 0.3rem;
  cursor: default;
  transition: background 0.2s, transform 0.2s;
  border-left: 3px solid transparent;
}
.event-item:hover {
  background: white;
  border-left-color: #003087;
  transform: translateX(4px);
  box-shadow: 0 2px 12px rgba(0,48,135,0.08);
}
.event-month {
  font-size: 0.72rem;
  font-weight: 700;
  color: #0066CC;
  background: #eef3ff;
  padding: 0.2rem 0.5rem;
  border-radius: 4px;
  flex-shrink: 0;
  min-width: 46px;
  text-align: center;
  transition: background 0.2s, color 0.2s;
}
.event-item:hover .event-month {
  background: #003087;
  color: white;
}
.event-text {
  font-size: 0.9rem;
  color: #374151;
  line-height: 1.5;
  font-weight: 400;
  transition: color 0.2s;
}
.event-item:hover .event-text {
  color: #003087;
  font-weight: 500;
}

/* 특별 항목 강조 */
.event-item.highlight .event-text { font-weight: 600; color: #003087; }
.event-item.highlight .event-month { background: #003087; color: white; }
.event-item.award .event-month { background: #FF6600; color: white; }
.event-item.award .event-text { color: #c45200; }

@media (max-width: 600px) {
  .year-col { width: 72px; }
  .year-badge { width: 64px; font-size: 0.8rem; }
  .event-text { font-size: 0.82rem; }
}

const container = document.getElementById('timeline');

data.slice().reverse().forEach(({ year, events }) => {
  const group = document.createElement('div');
  group.className = 'year-group';

  const yearCol = document.createElement('div');
  yearCol.className = 'year-col';
  yearCol.innerHTML = `<div class="year-badge">${year}</div>`;

  const lineCol = document.createElement('div');
  lineCol.className = 'line-col';
  lineCol.innerHTML = `<div class="line-dot"></div><div class="line-bar"></div>`;

  const eventsCol = document.createElement('div');
  eventsCol.className = 'events-col';

  events.forEach(({ month, text, type }) => {
    const item = document.createElement('div');
    item.className = 'event-item' + (type ? ` ${type}` : '');
    item.innerHTML = `<span class="event-month">${month}월</span><span class="event-text">${text}</span>`;

  });

  group.appendChild(yearCol);
  group.appendChild(lineCol);
  group.appendChild(eventsCol);
  container.appendChild(group);
